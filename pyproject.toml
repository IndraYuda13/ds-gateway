[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-web-api"
version = "1.1.0"
description = "High-performance OpenAI-compatible API proxy for DeepSeek Web with WASM PoW bypass and session persistence."
authors = [{ name = "Indra Yuda", email = "indrayuda13@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
deepseek-server = "app.main:app"
deepseek-cli = "client.deepseek_cli:main"
