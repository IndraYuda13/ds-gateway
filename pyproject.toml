[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-gateway"
version = "1.1.0"
description = "Lightweight OpenAI-compatible conversational gateway and CLI interface with session persistence."
authors = [{ name = "Indra Yuda", email = "indrayuda13@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ds-server = "app.main:app"
ds-cli = "client.ds_cli:main"
