version: '3.8'

services:
  ds-gateway:
    build: .
    container_name: ds-gateway
    restart: unless-stopped
    ports:
      - "8550:8550"
    environment:
      - DS_TOKEN=${DS_TOKEN:-qosOTpuhzASFMfNcNw1rTJhJXaV6CK9icR3C94feTk1ZY7IPBpFI/Ogk9pOp69ek}
      - PORT=8550
      - HOST=0.0.0.0
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
